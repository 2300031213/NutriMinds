[project]
name = "nutriminds"
version = "1.0.0"
description = "Personalized Nutrition and Wellness Intelligence System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "passlib>=1.7.4",
    "pydantic>=2.8.0",
    "pydantic-core>=2.20.0",
    "email-validator>=2.2.0",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0"
]

[tool.vercel]
entrypoint = "api.index:app"
